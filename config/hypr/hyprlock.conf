background {
    monitor =
    path = /home/oscar/walls/chinatown.png # only png supported for now
    # color = $color1

    # all these options are taken from hyprland, see https://wiki.hyprland.org/Configuring/Variables/#blur for explanations
    blur_size = 4
    blur_passes = 2 # 0 disables blurring
    noise = 0.0117
    contrast = 1.3000 # Vibrant!!!
    brightness = 0.8000
    vibrancy = 0.2100
    vibrancy_darkness = 0.0
}

input-field {
    size = 250, 50
    outline_thickness = 3
    outer_color = rgba(153, 0, 240, 1)
    inner_color = rgba(36, 40, 59, 1)
    font_color = rgba(122, 162, 247, 1)
    dots_size = 0.26 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.64 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    fade_on_empty = true
    placeholder_text = <i>Password...</i> # Text rendered in the input box when it's empty.
    hide_input = false
    position = 0, 90
    halign = center
    valign = bottom
}

# Current time
label {
    monitor =
    text = cmd[update:1000] echo "<b><big> $(date +"%H:%M") </big></b>"
    font_size = 300
    font_family = Pixel Code
    color = rgba(122, 162, 247, 1)
    shadow_passes = 1
    shadow_size = 2
    halign = center
    valign = center
}

